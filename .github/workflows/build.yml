name: Build apps
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  # Let main publication finish; a queued run builds the newest pending push.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
env:
  CARGO_BUILD_JOBS: 3
  CARGO_TERM_COLOR: always
jobs:
  sprite-tools:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - run: python -m pip install -r tools/requirements-assets.txt
      - run: python -m unittest discover -s tools -p 'test_sprite*.py' -v
      - run: python -m unittest discover -s tools -p 'test_rolling_release.py' -v
      - name: Check native sprite compositor
        run: |
          cc -std=c11 -Wall -Wextra -Werror -O1 -fsanitize=address,undefined -Igenerated/tintin/runtime/include -Iapp/src-tauri/native tools/test_sprite_compositor.c app/src-tauri/native/sprites.c -o /tmp/test-sprite-compositor
          /tmp/test-sprite-compositor
  macos:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install pinned Rust
        run: rustup toolchain install 1.95.0 --profile minimal && rustup default 1.95.0
      - run: python3 tools/core_sources.py verify
      - run: npm ci --prefix app
      - name: Check frontend and save recovery
        run: |
          npm run build --prefix app
          cargo test --locked --manifest-path app/src-tauri/Cargo.toml
      - name: Generate native macOS icon
        run: |
          npm --prefix app run tauri -- icon "$GITHUB_WORKSPACE/app/src-tauri/icons/icon.png" --output "$RUNNER_TEMP/tintin-icons"
          cp "$RUNNER_TEMP/tintin-icons/icon.icns" app/src-tauri/icons/icon.icns
      - name: Build optimized macOS app
        env:
          APPLE_SIGNING_IDENTITY: '-'
        run: npm --prefix app run tauri -- build --ci --bundles app,dmg -- --locked
      - name: Verify locked dependencies
        run: git diff --exit-code -- app/package-lock.json app/src-tauri/Cargo.lock
      - name: Package app
        run: |
          mkdir -p artifacts
          ditto -c -k --sequesterRsrc --keepParent 'app/src-tauri/target/release/bundle/macos/Tintin Player.app' artifacts/Tintin-Player-macOS-arm64.zip
          cp app/src-tauri/target/release/bundle/dmg/*.dmg artifacts/Tintin-Player-macOS-arm64.dmg
          python3 tools/artifact_manifest.py artifacts
      - uses: actions/upload-artifact@v6
        with:
          name: Tintin-Player-macOS-arm64
          path: artifacts/*
          if-no-files-found: error
          compression-level: 0
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install pinned Rust and Android SDK
        run: |
          rustup toolchain install 1.95.0 --profile minimal --target aarch64-linux-android
          rustup default 1.95.0
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.1.12297006'
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.1.12297006" >> "$GITHUB_ENV"
      - run: python3 tools/core_sources.py verify
      - run: npm ci --prefix app
      - name: Build optimized ARM64 APK
        run: npm --prefix app run tauri -- android build --ci --target aarch64 --apk
      - name: Verify locked dependencies
        run: git diff --exit-code -- app/package-lock.json app/src-tauri/Cargo.lock
      - name: Sign APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: python3 tools/sign_android.py
      - run: python3 tools/artifact_manifest.py artifacts
      - uses: actions/upload-artifact@v6
        with:
          name: Tintin-Player-Android-arm64
          path: artifacts/*
          if-no-files-found: error
          compression-level: 0
  rolling-release:
    needs: [sprite-tools, macos, android]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v6
        with:
          pattern: Tintin-Player-*
          path: release-artifacts
      - name: Update rolling release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 tools/rolling_release.py release-artifacts
